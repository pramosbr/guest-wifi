<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101b2c">
<title>Guest Wi-Fi</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(145deg,#101b2c,#243c53);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:grid;place-items:center;padding:24px;color:#172638}.card{width:min(100%,420px);background:white;border-radius:24px;padding:32px 26px;text-align:center;box-shadow:0 20px 55px #0003}.symbol{font-size:42px;margin-bottom:8px}h1{font-size:26px;margin:0 0 8px}p{color:#526276;margin:0 0 20px}.qr{width:min(100%,270px);height:auto;border:1px solid #e6ebef;border-radius:14px;padding:12px;background:white}.button{display:block;background:#183e60;color:white;text-decoration:none;border-radius:12px;padding:13px 16px;font-weight:600;margin:18px 0}.steps{text-align:left;background:#f3f6f9;padding:17px;border-radius:12px;font-size:14px;color:#405267}.steps strong{color:#172638}footer{font-size:12px;color:#788494;margin-top:20px}
</style>
</head>
<body><main class="card"><div class="symbol" aria-hidden="true">📶</div><h1>Welcome to our home</h1><p>Connect to our guest Wi-Fi</p><img class="qr" src="wifi-qr.png" alt="Guest Wi-Fi QR code"><a class="button" href="wifi-qr.png" download="guest-wifi-qr.png">Save Wi-Fi QR code</a><div class="steps"><strong>On iPhone:</strong> Save the QR code image, open it in Photos, then press and hold the QR code and choose Join Network if offered.<br><br><strong>On Android:</strong> Scan the QR code using the camera or Wi-Fi QR scanner.</div><footer>Enjoy your visit!</footer></main></body>
</html>
